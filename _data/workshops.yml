- name: "The 2nd Workshop on AI Principles in Science Communication (Ai4SC'25)"
  abstract: >
    This workshop explores the fundamental scientific communication methodology using AI technology, 
    software ecosystems, and methods of software usability, discovery, and automation, AI-enabled 
    software and repository for enriching scientific communications, constructing tools like automated 
    knowledge processing, knowledge graph constructions, and documentation generation in the context 
    of science communication.
    <br><br>
    Through a series of presentations and discussions, participants will gain a comprehensive understanding 
    of how AI, particularly generative AI, can transform science communication, making complex information 
    more accessible and engaging for a broader audience. Furthermore, beyond communication, the workshop 
    will highlight the broader impact of AI on scientific software ecosystems and repositories, as well 
    as integration with critical technologies such as databases, workflow management, knowledge graphs, 
    ontologies, and security frameworks. Discussions will explore AI-driven techniques for software 
    analysis, repository management, discovery, and reusability.
    <br><br>
    Additionally, the workshop will highlight the interconnectedness of generative AI with other critical 
    technologies, including databases, workflow management, knowledge graphs, ontologies, and security 
    mechanisms. By examining these relationships, participants will develop a deeper appreciation of 
    the broader impact of generative AI on scientific research and communication.
  url: https://national-data-platform.github.io/ai4sc25/

- name: "The 5th Workshop on Reproducible Workflows, Data Management, and Security (ReWorDS'25)"
  abstract: >
    This workshop seeks to explore ideas and experiences on what kinds of infrastructure developments 
    can improve upon the state of the art. Explorations of component packaging via containers and virtual 
    machines, automation scripting, deployment,  portability builds, and system support for these and other 
    relevant activities are key infrastructure. Provenance collection, exploration, and tracking are key for 
    a well-documented scientific output. Using existing systems to achieve these goals via experiences is 
    important for developing best practices that span application domains. Data privacy techniques such as 
    multi-party encryption and differential privacy are important as well. Issues with managing large data 
    sets and workflow intermediate data, particularly those intended to manage publicly accessed data for 
    use and reuse are encouraged. New techniques and technologies that address reproducibility requirements 
    are also requested. We seek work on all of these, and related, topics as well as position and experience 
    papers looking to drive the conversation for practitioners and researchers in these spaces.
    <br><br>
    This workshop contributes by sharing experiences and exploring the various technological infrastructure 
    needs to support effective, convenient workflow systems and application composition structures and approaches 
    across a broad spectrum of HPC environments from clusters to supercomputers to cloud systems.
  url: https://sites.google.com/view/rewords25/

- name: "The 6th Global Research Platform Workshop (6GRP)"
  abstract: >
    The Global Research Platform (GRP) is an international scientific collaboration that aims to create 
    one-of-a-kind advanced ubiquitous services that integrate resources around the globe at speeds of gigabits 
    and terabits per second. GRP focuses on design, implementation, and operation strategies for next-generation 
    distributed services and infrastructure to facilitate high-performance data gathering, analytics, transport, 
    computing, and storage, at 100 Gbps or higher. GRP actively works with partners in North America, Asia, Europe, 
    and South America to customize international fabrics and distributed cyberinfrastructure to support data-intensive 
    scientific workflows.
  url: https://www.theglobalresearchplatform.net/

- name: "Wins, Fails, and Breakthroughs: How to Increase Your Influence and Facilitate Effective Collaboration in eScience Projects and Partnerships"
  abstract: >
    This half-day workshop is designed for computer and data scientists, researchers, and academics who are 
    actively engaged in eScience projects. The workshop addresses challenges in applying eScience technologies 
    to real-world problems and provides a structured approach to enhancing collaboration, influence, and communication 
    within interdisciplinary teams. Participants will gain insights into navigating complex academic, industry, and 
    governmental landscapes to secure funding, align stakeholders, and drive impactful research outcomes. 
    <br><br>
    Through interactive discussions and hands-on group exercises, attendees will explore frameworks such as ABT 
    narrative structure (“And, But, Therefore”), empathy mapping for stakeholder alignment, and root-cause analysis 
    using the 5 Whys. The workshop emphasises learning from both successful and failed initiatives to cultivate 
    strategies for overcoming barriers in eScience work and research.
    <br><br>
    This workshop is tailored for computer and data scientists, PhD students, postdoctoral researchers, Professors, 
    and senior academics actively involved in eScience projects. It is particularly relevant for those working at 
    the intersection of computational science and societal challenges who seek to improve their ability to communicate 
    research outcomes effectively, foster interdisciplinary collaboration, and secure funding.
  url: https://www.nicd.org.uk/escience-2025-workshop?hs_preview=AXDmPhrk-188603163204

- name: "Workshop on Harmonizing Python Workflows (invitation only)"
  abstract: >
    An increasing number of large scale scientific workflow applications are expressed or 
    managed using the Python language. Such workflows consist of large graphs of complex 
    tasks combining data gathering, data processing, simulation, training, inference, 
    validation, and visualization. While there have been many successes, large scale 
    deployments still encounter many barriers due to the need to integrate many different 
    technologies: applications, workflow systems, software environments, cluster 
    technologies, interactive notebooks, visualization systems, and more. The POSE-HARMONY 
    Project seeks to "harmonize" common practices surrounding Python-based workflows, 
    considering issues such as workflow management, technology integration, software 
    deployment, building and testing, documentation, and other matters of common concern. 
    This workshop will be organized in an interactive manner to enable participants to 
    collectively define the common space of challenges in Python workflow deployment, 
    propose resources and solutions of common interest, and point the way towards a common 
    open source ecosystem.
  url: https://workflows.community/workshops/harmony-2025/
