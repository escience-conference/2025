---
layout: twitter
permalink: /tutorials
title: Tutorials
---

{% assign ts = site.data.tutorials %}
<div class="row">
    {% for t in ts %}
    <div class="col-sm-12 col-md-12" style="margin-bottom: 1em">
        <strong style="font-size: 1.2em">{{ t.title }}</strong><br />
        <p><i class="far fa-users" style="margin-right: 10px;"></i><b>{{ t.organizers | join: ', ' }}</b></p>
        <p>{{ t.abstract }}</p>
    </div>
    {% endfor %}
</div>
